<div class="container py-4" style="max-width: 700px;">
    <div class="card border-10 shadow-sm rounded-4 overflow-hidden">

        <div class="card-header text-white border-0 py-3 px-4"
            style="background: linear-gradient(135deg, #0d2137 0%, #1565c0 100%);">

            <h5 class="mb-0 fw-bold" *ngIf="!form.data.id">
                <i class="bi bi-person-fill-add me-1">Add Order</i>
            
            </h5>

            <h5 class="mb-0 fw-bold" *ngIf="form.data.id>0">
                <i class="bi bi-pencil-square me-2">Update Order</i>
           
            </h5>

        </div>

        <div class="card-body p-4">

            <!-- Error Message -->
            <div class="alert alert-danger py-2 mx-3 mt-3 d-flex justify-content-between align-items-center"
                *ngIf="form.error && form.message">

                <span>
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                    {{form.message}}
                </span>

                <button type="button" class="btn-close" (click)="form.message=''">
                </button>

            </div>

            <!-- Success Message -->
            <div class="alert alert-success py-2 mx-3 mt-3 d-flex justify-content-between align-items-center"
                *ngIf="!form.error && form.message">

                <span>
                    <i class="bi bi-check-circle-fill me-2"></i>
                    {{form.message}}
                </span>

                <button type="button" class="btn-close" (click)="form.message=''">
                </button>

            </div>

            <!--Name all details-->

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        VehicleName <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" [(ngModel)]="form.data.vehicleName" name="vehicleName"
                        placeholder="Enter the VehicleName">
                    <small class="text-danger">{{form.inputerror.vehicleName}}</small>
                </div>


                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        Model <span class="text-danger">*</span>
                    </label>

                    <input type="text" class="form-control" [(ngModel)]="form.data.model" name="model"
                        placeholder="Enter the model">
                    <small class="text-danger">{{form.inputerror.model}}</small>
                </div> 


                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        Color <span class="text-danger">*</span>
                    </label>

                    <input type="text" class="form-control" [(ngModel)]="form.data.color" name="color"
                     placeholder="Enter the color">
                    <small class="text-danger">{{form.inputerror.color}}</small>
                </div>

            </div>

            <!---Buttons Name all details-->

            <div class="d-flex gap-2 mt-4 pt-3 border-top">
                <button class="btn btn-primary" (click)="submit()">
                    <i class="bi bi-save me-1"></i>
                    Save
                </button>

                <button type="button" (click)="forward('vehicleList')" class="btn btn-outline-secondary">
                    <i class="bi bi-list-ul me-1"></i>
                    List
                </button>
            </div>

        </div>

    </div>

</div>
